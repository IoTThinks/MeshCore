name: Build MeshCore target

on:
  workflow_dispatch:
    inputs:
      env:
        description: PlatformIO env to build (e.g. Heltec_v3_repeater)
        required: true
      version:
        description: Firmware version string (optional, defaults to the branch name)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          ENV_NAME: ${{ inputs.env }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$ENV_NAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Bad env name"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Bad version"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ github.ref_name }}-${{ inputs.env }}

      - run: pip install platformio

      - name: Build
        env:
          ENV_NAME: ${{ inputs.env }}
          FIRMWARE_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: bash build.sh build-firmware "$ENV_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.env }}
          path: out/*
          retention-days: 30
          if-no-files-found: error
